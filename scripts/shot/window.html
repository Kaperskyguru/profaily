<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Product shot, matched to Typefully's style in Profaily's colours: a real app capture in a light window (three
     window dots, rounded corners, soft shadow) on the brand gradient, mint #8dd796 glowing top right into forest
     #2f7a43 → #1b3a32 → #0d241f, with a thin even margin. Sizes come from scripts/shot.ts (FRAME). */
  * { margin: 0; box-sizing: border-box; }
  html, body { width: {{OUT_W}}px; height: {{OUT_H}}px; overflow: hidden; }
  body {
    background:
      radial-gradient(120% 90% at 85% 0%, #8dd796 0%, rgba(141, 215, 150, 0) 55%),
      linear-gradient(140deg, #2f7a43 0%, #1b3a32 55%, #0d241f 100%);
  }
  .win {
    position: absolute; left: {{MARGIN}}px; top: {{MARGIN}}px; width: {{WIN}}px;
    border-radius: 14px; overflow: hidden; background: #ffffff;
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.18);
  }
  .bar { height: {{BAR}}px; background: #f6f6f5; border-bottom: 1px solid #e7e9e6; display: flex; align-items: center; gap: 7px; padding-left: 12px; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .shot { width: {{WIN}}px; height: {{IMG_H}}px; overflow: hidden; background: #ff00ff; }
  .shot img { display: block; width: {{IMG_W}}px; height: auto; margin-left: -{{CROP_X}}px; margin-top: -{{CROP_Y}}px; }
</style>
</head>
<body>
  <div class="win">
    <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div class="shot"><img src="{{SHOT}}" alt=""></div>
  </div>
</body>
</html>
