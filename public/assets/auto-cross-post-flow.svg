    <path d="M14 4h4c.2 2.1 1.4 3.7 4 4.5v4c-1.7-.1-3.1-.7-4-1.6v5.5a6 6 0 1 1-5-5.9v4.1a2.1 2.1 0 1 0 1 1.8V4Z" fill="#FE2C55" opacity=".9" transform="translate(1 -.3)"/>
