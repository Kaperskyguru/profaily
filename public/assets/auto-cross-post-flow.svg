<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" fill="none">
  <title>Automatic video cross-posting workflow</title>
  <desc>A TikTok video post branches simultaneously to selected Facebook, Instagram, YouTube, Pinterest, Twitch, and Snapchat destinations. Other source options shown are Instagram, Facebook, and YouTube.</desc>
  <defs>
    <linearGradient id="panel" x1="100" y1="0" x2="900" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#0D1214"/><stop offset="1" stop-color="#080D0F"/></linearGradient>
    <linearGradient id="routeGlow" x1="130" y1="250" x2="850" y2="250" gradientUnits="userSpaceOnUse"><stop stop-color="#9DCEA0"/><stop offset="1" stop-color="#C8EBAD"/></linearGradient>
    <linearGradient id="instagram" x1="0" y1="48" x2="48" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#FFB13D"/><stop offset=".48" stop-color="#E1306C"/><stop offset="1" stop-color="#833AB4"/></linearGradient>
    <filter id="softGlow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="cardGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect x="1" y="1" width="1038" height="498" rx="27" fill="url(#panel)" stroke="#303A3B" stroke-width="2"/>
  <path d="M2 63H1038" stroke="#263031" stroke-width="1.5"/>
  <text x="36" y="39" fill="#A6B1B4" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">POST ON</text>
  <g transform="translate(134 22)">
