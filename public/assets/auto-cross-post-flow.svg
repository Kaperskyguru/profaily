  <text x="907" y="36" text-anchor="middle" fill="#9EAAA9" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.4">AUTOMATIC CROSS-POSTING</text>

  <text x="36" y="101" fill="#71807B" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.7">OTHER SOURCE OPTIONS</text>
