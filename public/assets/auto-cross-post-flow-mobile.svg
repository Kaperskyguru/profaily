<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1010" viewBox="0 0 760 1010" fill="none">
  <title>Automatic video cross-posting workflow from TikTok to selected platforms</title>
  <desc>A TikTok video post branches simultaneously to selected Facebook, Instagram, YouTube, Pinterest, Twitch, and Snapchat destinations.</desc>
  <defs>
